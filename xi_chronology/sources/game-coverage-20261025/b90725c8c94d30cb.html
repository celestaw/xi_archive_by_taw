      var ytplayer;

      function onYouTubePlayerReady(playerId) {
        ytplayer = document.getElementById("myytplayer");
      }

      var playVideo = function (id) {
        ytplayer.cueVideoById(id, 0, null);
        ytplayer.playVideo();
      };

      dojo.ready(function () {
        var params = { allowScriptAccess: "always" };
        var atts = { id: "myytplayer" };
        swfobject.embedSWF(
          "https://www.youtube.com/v/89xWtLJiK0w?enablejsapi=1&playerapiid=ytplayer&version=3",
          "pv-video",
          "540",
          "348",
          "8",
          null,
          null,
          params,
          atts
        );

        for (var key in pvs) {
          res = dojo.query("#pv-" + key + " a");
          if (res.length <= 0) continue;
          res[0].href = 'javascript:playVideo( "' + pvs[key] + '")';
        }
      });
